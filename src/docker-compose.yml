version: '3.9'

services:
  # Serviço de banco de dados (SQL Server)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    networks:
      - micros_net
    volumes:
      - sql_data:/var/opt/mssql

  # Microsserviço de Estoque
  estoque-service:
    build:
      context: ./Estoque
      dockerfile: Dockerfile
    container_name: estoque-service
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EstoqueDb;User Id=sa;Password=Your_password123;TrustServerCertificate=true;
    networks:
      - micros_net

  # Microsserviço de Vendas
  vendas-service:
    build:
      context: ./Vendas
      dockerfile: Dockerfile
    container_name: vendas-service
    ports:
      - "5002:8080"
    depends_on:
      - sqlserver
      - estoque-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=VendasDb;User Id=sa;Password=Your_password123;TrustServerCertificate=true;
    networks:
      - micros_net

# Rede compartilhada entre os serviços
networks:
  micros_net:
    driver: bridge

# Volume para persistência do banco de dados
volumes:
  sql_data:

rabbitmq:
  image: rabbitmq:3-management
  container_name: rabbitmq
  ports:
    - "5672:5672"   # porta para comunicação do serviço
    - "15672:15672" # porta da interface web
  networks:
    - micros_net